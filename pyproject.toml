[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ghostos"
version = "0.1.0"
description = "An autonomous agent that operates a computer: plans, acts, verifies, and heals itself."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amartya Singh" }]
dependencies = [
  "playwright>=1.48",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "imageio-ffmpeg>=0.5"]

[project.scripts]
ghost = "ghostos.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ghostos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: drives a real browser / full agent loop"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"ghostos/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
