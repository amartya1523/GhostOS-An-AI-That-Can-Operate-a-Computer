<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="GhostOS — an AI that operates a computer">
  <defs>
    <radialGradient id="bg" cx="22%" cy="10%" r="90%">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="0.55" stop-color="#0b0c16"/>
      <stop offset="1" stop-color="#07080d"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1b1f33" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: "SF Mono", Menlo, Consolas, monospace; }
      @keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(300px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .scan { animation: sweep 4.5s linear infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .glow { animation: pulse 2.6s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)" opacity="0.6"/>
  <rect class="scan" x="0" y="0" width="1200" height="60" fill="url(#scan)"/>

  <!-- old element (dead selector) and healed element -->
  <g transform="translate(820 70)">
    <rect width="300" height="170" rx="16" fill="#0f1222" stroke="#2c3150"/>
    <circle cx="20" cy="18" r="5" fill="#f87171"/><circle cx="36" cy="18" r="5" fill="#fbbf24"/><circle cx="52" cy="18" r="5" fill="#4ade80"/>
    <rect x="24" y="44" width="150" height="34" rx="8" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="34" y="66" class="m" font-size="13" fill="#fca5a5" text-decoration="line-through">#login-btn</text>
    <rect class="glow" x="110" y="104" width="166" height="40" rx="20" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="2.5"/>
    <text x="193" y="129" class="t" font-size="14" font-weight="700" fill="#bbf7d0" text-anchor="middle">Log in  ✓ healed</text>
    <path d="M150 80 C 160 100, 170 100, 180 104" stroke="#a78bfa" stroke-width="2" fill="none"/>
  </g>

  <text x="64" y="128" class="t" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2">
    <tspan fill="#a78bfa">◆</tspan> GhostOS
  </text>
  <text x="68" y="172" class="t" font-size="21" fill="#c4c8e0">An AI that operates a computer — and heals itself when the UI changes.</text>
  <text x="68" y="226" class="m" font-size="16" fill="#8389a6">$ ghost run "log in, create an invoice for Globex, verify it worked"<tspan class="cursor" fill="#22d3ee">▌</tspan></text>
  <text x="68" y="262" class="m" font-size="13" fill="#5d6385">planner → operator → verifier → healer · memory · sandbox · human-in-the-loop</text>
</svg>
